[package]
name = "alc-auth"
version = "0.1.0"
edition = "2021"

# 旧 OAuth handler 群の撤去 (#479 PR-3) で argon2 / reqwest / url / urlencoding は
# 不要になり削除済み。
[dependencies]
alc-core = { path = "../alc-core" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
