[package]
name = "alc-dtako"
version = "0.1.0"
edition = "2021"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(coverage)'] }

[dependencies]
alc-core = { path = "../alc-core" }
async-trait = "0.1"
sqlx = { version = "0.8", features = ["postgres", "chrono", "uuid"] }
axum = { version = "0.8", features = ["multipart"] }
rand = "0.8"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
