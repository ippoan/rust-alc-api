# 指静脈 (vein) の Worker。rust-alc-api を Cloudflare Workers へ段階移行する最初の 1 本
# (Refs #680 / #683)。wasm 専用なので monolith の workspace から exclude し、自前の
# Cargo.lock を持つ独立 workspace にしている (Bazel にも入れない)。
#
# 口 (routes)・照合 (matcher)・trait は crates/alc-vein を `default-features = false` (sqlx 抜き) で
# そのまま使い、この Worker は Hyperdrive 越しの repo 実装 (`HdVeinTemplatesRepository`) と
# workers-rs への載せ方だけを持つ (Refs #682 / #686)。
[package]
name = "alc-vein-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]

# alc-vein は private repo ippoan/vein-match (vein-match / vein-match-search) に git 依存する。
# 取得の仕方は crates/alc-vein/Cargo.toml と同じ (ローカルは `gh auth setup-git`、CI は
# ippoan/ci-workflows の private-git-auth)。
[dependencies]
alc-core-wasm = { path = "../../crates/alc-core-wasm" }
alc-vein = { path = "../../crates/alc-vein", default-features = false }
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["js", "with-chrono-0_4", "with-uuid-1"] }
tower-service = "0.3"
uuid = { version = "1", features = ["js"] }
wasm-bindgen-futures = "0.4"
worker = { version = "0.8", features = ["http", "axum", "tokio-postgres"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
