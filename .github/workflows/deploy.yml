name: Deploy

on:
  workflow_call:
    inputs:
      image_sha:
        required: true
        type: string
      ref_name:
        required: false
        type: string
    secrets:
      GCP_SA_KEY:
        required: true
      NOTIFY_WORKER_SECRET_STAGING:
        required: false

# Environment is derived from github context:
#   pull_request → staging
#   tag push     → production

env:
  REGION: asia-northeast1
  PROJECT: cloudsql-sv
  REPO: ghcr.io/ippoan/rust-alc-api
  AR_PREFIX: asia-northeast1-docker.pkg.dev/cloudsql-sv/ghcr

jobs:
  # ---------------------------------------------------------------------------
  # NOTE (Refs #482): staging image (app / db) の build は ci.yml 側に移設した。
  #   - staging app image → ci.yml build-image job (bazel-bin から直接 build)
  #   - staging-db image  → ci.yml staging-db job
  # 本 workflow が呼ばれる時点 (ci.yml deploy job の needs 充足後) で
  # ${REPO}-staging:${sha} / ${REPO}-staging-db:latest は push 済み。
  # gateway + per-domain は #556 で廃止し、deploy は monolith (backend) 1 本のみ。
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Production: promote dev → version tag
  # ---------------------------------------------------------------------------
  promote-images:
    name: "Promote images"
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote dev → version + sha (all images)
        run: |
          REPO="${{ env.REPO }}"
          TAG="${{ inputs.ref_name }}"
          SHA="${{ inputs.image_sha }}"
          # gateway + per-domain 廃止で monolith (backend) の 1 image のみ (Refs #556)。
          for suffix in ""; do
            docker pull "${REPO}${suffix}:dev"
            docker tag "${REPO}${suffix}:dev" "${REPO}${suffix}:${TAG}"
            docker tag "${REPO}${suffix}:dev" "${REPO}${suffix}:${SHA}"
            docker push "${REPO}${suffix}:${TAG}"
            docker push "${REPO}${suffix}:${SHA}"
          done

  # ---------------------------------------------------------------------------
  # Production: run migrations
  # ---------------------------------------------------------------------------
  migrate:
    name: "Run DB migrations"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [promote-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # runtime SA は cloudrun/render.sh が single source of truth (Refs #606)。
      # ここで値を再掲すると render.sh と drift し、T-E で compute SA から
      # roles/editor を剥がした時に job だけ黙って動かなくなるので、render.sh の
      # production 出力から読み出す (image_sha は SA 選択に影響しないので dummy)。
      - name: Resolve runtime service account
        run: |
          set -euo pipefail
          SA=$(bash cloudrun/render.sh backend production dummy \
                 | awk '/serviceAccountName:/{print $2; exit}')
          test -n "$SA"
          echo "RUNTIME_SA=$SA" >> "$GITHUB_ENV"
          echo "::notice ::runtime SA for Cloud Run jobs: $SA"

      - name: Run migrations
        run: |
          AR_IMAGE="${{ env.AR_PREFIX }}/${{ env.REPO }}:${{ inputs.image_sha }}"
          JOB_NAME="rust-alc-api-migrate"

          if gcloud run jobs describe $JOB_NAME --region ${{ env.REGION }} --project ${{ env.PROJECT }} &>/dev/null; then
            gcloud run jobs update $JOB_NAME \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --image "$AR_IMAGE" \
              --service-account "$RUNTIME_SA"
          else
            gcloud run jobs create $JOB_NAME \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --image "$AR_IMAGE" \
              --service-account "$RUNTIME_SA" \
              --set-secrets "DATABASE_URL=alc-app-database-url:latest" \
              --command "migrate" \
              --memory 512Mi --task-timeout 120s --max-retries 0
          fi

          gcloud run jobs execute $JOB_NAME \
            --region ${{ env.REGION }} --project ${{ env.PROJECT }} --wait

  # ---------------------------------------------------------------------------
  # Deploy services (shared by staging and production via render.sh)
  # ---------------------------------------------------------------------------
  deploy-services:
    name: "Deploy ${{ matrix.service }}"
    # PR (staging): staging image 群は ci.yml (build-image / staging-db) で
    # push 済みなので待つものが無く、即 deploy に入る (Refs #482)。
    needs: [promote-images, migrate]
    if: >-
      always() && (
        github.event_name == 'pull_request' ||
        (startsWith(github.ref, 'refs/tags/v') && needs.migrate.result == 'success')
      )
    runs-on: ubuntu-latest
    strategy:
      # 部分失敗時に他 service の deploy は止めず、失敗した service だけを
      # 独立してロールバックする (Refs #375)。
      fail-fast: false
      matrix:
        service: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Capture current serving revision (for rollback)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            case "${{ matrix.service }}" in
              backend) SVC="rust-alc-api-staging" ;;
              *)       SVC="rust-alc-api-staging-${{ matrix.service }}" ;;
            esac
          else
            case "${{ matrix.service }}" in
              backend) SVC="rust-alc-api" ;;
              *)       SVC="rust-alc-api-${{ matrix.service }}" ;;
            esac
          fi
          PREV=""
          if JSON=$(gcloud run services describe "$SVC" \
               --region ${{ env.REGION }} --project ${{ env.PROJECT }} --format=json 2>/dev/null); then
            PREV=$(printf '%s' "$JSON" | jq -r \
              '(([.status.traffic[]? | select((.percent // 0) > 0) | .revisionName] | map(select(. != null)))[0]) // ""')
          fi
          echo "ROLLBACK_SVC=$SVC" >> "$GITHUB_ENV"
          echo "PREV_REVISION=$PREV" >> "$GITHUB_ENV"
          echo "captured serving revision for rollback: ${PREV:-<none>} (svc=$SVC)"

      - name: Render and deploy
        id: deploy
        env:
          REF_NAME: ${{ inputs.ref_name }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DEPLOY_ENV="staging"
          else
            DEPLOY_ENV="production"
          fi
          RENDER_ARGS="${SERVICE} ${DEPLOY_ENV} ${{ inputs.image_sha }}"

          if [ "${DEPLOY_ENV}" = "staging" ]; then
            STAGING_URL="${{ vars.STAGING_API_URL }}"
            DB_IMAGE="${{ env.AR_PREFIX }}/${{ env.REPO }}-staging-db:latest"
            RENDER_ARGS="${RENDER_ARGS} --staging-url ${STAGING_URL} --db-image ${DB_IMAGE}"
          else
            # production: 新 revision を 0% (no-traffic) で deploy し、traffic は現
            # revision に残す。実際の切替は Release Wave flip に委ねる (Refs #137 Phase 5)。
            # 現在 traffic を受けている revision を解決して --pin-traffic-revision に渡す。
            case "${SERVICE}" in
              backend) PROD_SVC="rust-alc-api" ;;
              *)       PROD_SVC="rust-alc-api-${SERVICE}" ;;
            esac
            CURRENT_REV=""
            if SVC_JSON=$(gcloud run services describe "$PROD_SVC" \
                 --region ${{ env.REGION }} --project ${{ env.PROJECT }} --format=json 2>/dev/null); then
              CURRENT_REV=$(printf '%s' "$SVC_JSON" | jq -r \
                '(([.status.traffic[]? | select((.percent // 0) > 0) | .revisionName] | map(select(. != null)))[0]) // .status.latestReadyRevisionName // ""')
            fi
            if [ -z "$CURRENT_REV" ]; then
              # 新規 service の初回 production deploy。Cloud Run は単一 revision を必ず
              # 100% で配信するため、release revision をそのまま deploy すると 100% に
              # フリップし release/flip 分離不変条件 (verify-no-traffic) を破る。先に
              # 使い捨ての placeholder revision (gcr.io/cloudrun/hello) を 100% で立て、
              # それを anchor に release revision を 0% (no-traffic) で重ねる。placeholder
              # は実 release image とは別 template なので必ず別 revision として作られ、
              # 最初の Release Wave flip で release revision に traffic が移るまでの暫定
              # serving となる。新規 service は flip 前に実トラフィックを受けないので影響なし。
              echo "::notice::first production deploy for ${PROD_SVC} — bootstrapping a throwaway placeholder revision (gcr.io/cloudrun/hello) so the release revision can land at 0% (no-traffic)."
              gcloud run deploy "$PROD_SVC" \
                --image=gcr.io/cloudrun/hello \
                --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
                --ingress=all --quiet
              CURRENT_REV=$(gcloud run services describe "$PROD_SVC" \
                --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
                --format='value(status.latestReadyRevisionName)')
              echo "::notice::placeholder revision ready: ${CURRENT_REV} (serves 100% only until the first Release Wave flip moves traffic to the release revision)."
            fi
            if [ -n "$CURRENT_REV" ]; then
              RENDER_ARGS="${RENDER_ARGS} --pin-traffic-revision ${CURRENT_REV}"
              # no-traffic (0%) revision に release タグ由来の Cloud Run revision tag を
              # 付ける (tag は dot 不可なので v1.42.0 -> v1-42-0 にサニタイズ)。admin が
              # preview-*.ippoan.org (CF Access) 経由でこの tagged URL に到達して flip 前に
              # E2E 検証する。front↔backend のペアリング/互換は既存の retest
              # (compat_backend_repo) が担うので別 config は不要。Refs ippoan/ci-dashboard#260。
              # tag は preview 到達専用 (flip は最新 ready revision を anchor にする)。
              PREVIEW_TAG="$(printf '%s' "${REF_NAME##*/}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed -e 's/-\{2,\}/-/g' -e 's/^-//' -e 's/-$//' | cut -c1-60)"
              RENDER_ARGS="${RENDER_ARGS} --pending-tag ${PREVIEW_TAG}"
              echo "::notice::production no-traffic deploy: keep 100% on ${CURRENT_REV}; new revision -> 0% (preview tag=${PREVIEW_TAG}). Release Wave flip が最新 ready revision に traffic を振る。"
            else
              echo "::warning::no current revision for ${PROD_SVC} even after placeholder bootstrap — deploying with Cloud Run default traffic (latest 100%)."
            fi
          fi

          bash cloudrun/render.sh ${RENDER_ARGS} > /tmp/service.yaml

          echo "=== Generated YAML ==="
          cat /tmp/service.yaml

          gcloud run services replace /tmp/service.yaml \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT }}

      - name: Rollback traffic on deploy failure
        # deploy (render + replace) が失敗した時だけ、直前に 100% を受けていた
        # revision に traffic を戻す (Refs #375)。staging は replace が latest 100%
        # にフリップするので壊れた revision が serving し続けるのを防ぐ。production は
        # no-traffic deploy で traffic を旧 revision に固定済みなので、この update-traffic
        # は冪等 (同じ revision を 100% に再指定するだけ) で invariant を壊さない。
        if: always() && steps.deploy.outcome == 'failure' && env.PREV_REVISION != ''
        run: |
          echo "::warning::deploy failed for ${{ matrix.service }} — restoring 100% traffic to ${PREV_REVISION} on ${ROLLBACK_SVC}"
          gcloud run services update-traffic "${ROLLBACK_SVC}" \
            --to-revisions="${PREV_REVISION}=100" \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT }}

      - name: Ensure public access (staging)
        if: github.event_name == 'pull_request'
        run: |
          case "${{ matrix.service }}" in
            backend) SVC_NAME="rust-alc-api-staging" ;;
            *)       SVC_NAME="rust-alc-api-staging-${{ matrix.service }}" ;;
          esac
          gcloud run services add-iam-policy-binding "$SVC_NAME" \
            --region ${{ env.REGION }} \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --project ${{ env.PROJECT }}

      - name: Print URL
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then DEPLOY_ENV="staging"; else DEPLOY_ENV="production"; fi
          case "${{ matrix.service }}" in
            backend)
              if [ "${DEPLOY_ENV}" = "staging" ]; then SVC="rust-alc-api-staging"
              else SVC="rust-alc-api"; fi ;;
            *)
              if [ "${DEPLOY_ENV}" = "staging" ]; then SVC="rust-alc-api-staging-${{ matrix.service }}"
              else SVC="rust-alc-api-${{ matrix.service }}"; fi ;;
          esac
          URL=$(gcloud run services describe "$SVC" \
            --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
            --format 'value(status.url)')
          echo "::notice ::${{ matrix.service }} URL: $URL"

      - name: Print preview URL (production no-traffic tag)
        if: github.event_name != 'pull_request'
        run: |
          case "${{ matrix.service }}" in
            backend) SVC="rust-alc-api" ;;
            *)       SVC="rust-alc-api-${{ matrix.service }}" ;;
          esac
          # tagged (= preview) traffic target の URL を列挙する。pending-* tag が
          # 付いた 0% revision がここに出る。admin はこの URL を CF Access 配下の
          # preview-*.ippoan.org にマップして flip 前 E2E に使う (Refs ci-dashboard#260)。
          gcloud run services describe "$SVC" \
            --region ${{ env.REGION }} --project ${{ env.PROJECT }} --format=json 2>/dev/null \
            | jq -r '.status.traffic[]? | select(.tag != null) | "preview tag=\(.tag) url=\(.url)"' \
            | while IFS= read -r line; do
                [ -n "$line" ] && echo "::notice ::${{ matrix.service }} $line"
              done || true

  # ---------------------------------------------------------------------------
  # Staging: smoke test /api/notify/ingest after staging deploy
  #
  # email-receiver Worker から backend に届く shared secret 経路の検証。
  # GitHub Actions secret NOTIFY_WORKER_SECRET_STAGING の値で
  # rust-alc-api-staging /api/notify/ingest を叩く:
  #   - 401 -> secret drift (GCP / Cloud Run env binding / GitHub org secret のどこかで不一致) -> fail
  #   - 404 -> auth pass、tenant 存在しない (= 期待) -> pass
  #   - 400 -> auth pass、body 検証で reject -> pass
  #   - 200 -> auth pass、何かが起きた (smoke tenant が偶然存在) -> pass
  # ingest は gateway を経由せず backend に直接届く設計 (email-receiver Worker
  # の INGEST_ENDPOINT_STAGING と同じ URL)。
  # ---------------------------------------------------------------------------
  smoke-staging-ingest:
    name: "Smoke /api/notify/ingest on staging"
    needs: [deploy-services]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.deploy-services.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/notify/ingest with NOTIFY_WORKER_SECRET_STAGING
        env:
          SECRET: ${{ secrets.NOTIFY_WORKER_SECRET_STAGING }}
          INGEST_URL: https://rust-alc-api-staging-566bls5vfq-an.a.run.app/api/notify/ingest
        run: |
          set -eu
          if [ -z "${SECRET:-}" ]; then
            echo "::error::NOTIFY_WORKER_SECRET_STAGING is empty — check org secret sync (secrets-inventory sync-from-gcp ... ?targets=gh)"
            exit 1
          fi
          # tenant_short_id に意図的に存在しない 8 文字 hex を渡し、
          # auth 通過後 404 (tenant not found) で返ることを期待する。
          http=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
            "$INGEST_URL" \
            -H "x-worker-secret: $SECRET" \
            -H "Content-Type: application/json" \
            --data-binary '{"tenant_short_id":"smk00000"}')
          echo "HTTP $http"
          head -c 500 /tmp/body || true
          echo
          if [ "$http" = "401" ]; then
            echo "::error::auth failed — NOTIFY_WORKER_SECRET_STAGING in this repo does not match the value bound to rust-alc-api-staging (Cloud Run env -> GCP notify-worker-secret-staging). Check secrets-inventory get_drift."
            exit 1
          fi
          # 4xx (other than 401) / 200 はすべて auth 通過 = secret OK
          if [ "$http" -lt 200 ] || [ "$http" -ge 500 ]; then
            echo "::error::unexpected HTTP $http (5xx implies backend not yet ready or other issue)"
            exit 1
          fi
          echo "::notice::ingest auth accepted (HTTP $http) — NOTIFY_WORKER_SECRET_STAGING OK"

  # ---------------------------------------------------------------------------
  # Production: update archive job
  # ---------------------------------------------------------------------------
  update-archive:
    name: "Update Archive Job"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # runtime SA は cloudrun/render.sh が single source of truth (Refs #606)。
      # ここで値を再掲すると render.sh と drift し、T-E で compute SA から
      # roles/editor を剥がした時に job だけ黙って動かなくなるので、render.sh の
      # production 出力から読み出す (image_sha は SA 選択に影響しないので dummy)。
      - name: Resolve runtime service account
        run: |
          set -euo pipefail
          SA=$(bash cloudrun/render.sh backend production dummy \
                 | awk '/serviceAccountName:/{print $2; exit}')
          test -n "$SA"
          echo "RUNTIME_SA=$SA" >> "$GITHUB_ENV"
          echo "::notice ::runtime SA for Cloud Run jobs: $SA"

      - name: Update archive Job image
        run: |
          AR_IMAGE="${{ env.AR_PREFIX }}/${{ env.REPO }}:${{ inputs.image_sha }}"
          gcloud run jobs update rust-alc-api-archive \
            --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
            --image "$AR_IMAGE" \
            --service-account "$RUNTIME_SA"
          echo "::notice ::Archive Job updated (runtime SA: $RUNTIME_SA)"

  # ---------------------------------------------------------------------------
  # Production: verify the tag release did NOT flip traffic
  #
  # deploy/release 分離の invariant チェック: tag (v*) release は新 revision を
  # deploy するだけで、トラフィックは旧 revision に残す (= 切替は Release Wave
  # flip で別途行う) のが正しい。各 production service について「最新 revision の
  # traffic % が 0 か」を確認し、0 でなければ (= release が勝手にフリップした)
  # FAIL する。
  #
  # deploy-services は production では --pin-traffic-revision で新 revision を 0%
  # に固定するため、通常 release ではここを通る。新規 service の初回 deploy だけは
  # anchor となる旧 revision が無く Cloud Run が latest を 100% にしてしまうので、
  # deploy-services 側で placeholder revision (gcr.io/cloudrun/hello) を先に立てて
  # から release を 0% で重ねる (= このガードを新規 service でも満たす)。
  # ---------------------------------------------------------------------------
  verify-no-traffic:
    name: "Verify release did not flip traffic"
    needs: [deploy-services]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.deploy-services.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Assert latest revision receives 0% traffic
        run: |
          set -euo pipefail
          # gateway + per-domain 廃止で monolith (rust-alc-api) 1 本のみ検証 (Refs #556)。
          SERVICES="rust-alc-api"
          fail=0
          for SVC in $SERVICES; do
            echo "::group::$SVC traffic split"
            JSON=$(gcloud run services describe "$SVC" \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} --format=json)
            LATEST=$(printf '%s' "$JSON" | jq -r '.status.latestReadyRevisionName // ""')
            # 最新 revision に向いている traffic を集計する。traffic entry は
            # revisionName 指定 or latestRevision:true のどちらでも latest を指し得る。
            PCT=$(printf '%s' "$JSON" | jq --arg r "$LATEST" \
              '[.status.traffic[]? | select(.revisionName == $r or .latestRevision == true) | (.percent // 0)] | add // 0')
            echo "latest ready revision: $LATEST"
            printf '%s' "$JSON" | jq -r '.status.traffic[]? | "  \(.percent // 0)% -> \(.revisionName // "@latest")\(if .tag then " (tag: \(.tag))" else "" end)"'
            if [ "${PCT:-0}" != "0" ]; then
              echo "::error::$SVC: newly released revision ($LATEST) is serving ${PCT}% traffic. A tag release must NOT flip traffic — traffic switching is the Release Wave flip's job. Make the production deploy no-traffic."
              fail=1
            else
              echo "OK: latest revision serves 0% (no auto-flip)"
            fi
            echo "::endgroup::"
          done
          if [ "$fail" != "0" ]; then
            exit 1
          fi
          echo "✅ All services: the released revision receives 0% traffic (deploy/release separation holds)."
