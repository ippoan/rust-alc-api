name: Deploy

on:
  workflow_call:
    inputs:
      image_sha:
        required: true
        type: string
      ref_name:
        required: false
        type: string
    secrets:
      GCP_SA_KEY:
        required: true
      NOTIFY_WORKER_SECRET_STAGING:
        required: false

# Environment is derived from github context:
#   pull_request → staging
#   tag push     → production

env:
  REGION: asia-northeast1
  PROJECT: cloudsql-sv
  REPO: ghcr.io/ippoan/rust-alc-api
  AR_PREFIX: asia-northeast1-docker.pkg.dev/cloudsql-sv/ghcr

jobs:
  # ---------------------------------------------------------------------------
  # Staging: build staging images (entrypoint.sh + sidecar)
  # ---------------------------------------------------------------------------
  staging-db:
    name: "Build staging-db"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push staging-db
        run: |
          docker build -f staging/Dockerfile.postgres \
            -t ${{ env.REPO }}-staging-db:latest .
          docker push ${{ env.REPO }}-staging-db:latest

  staging-images:
    name: "Build staging ${{ matrix.service }}"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { service: backend, suffix: "",       binary: rust-alc-api }
          - { service: tenko,   suffix: "-tenko", binary: tenko-api }
          - { service: carins,  suffix: "-carins", binary: carins-api }
          - { service: dtako,   suffix: "-dtako",   binary: dtako-api }
          - { service: trouble, suffix: "-trouble", binary: trouble-api }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build staging image
        run: |
          SHA="${{ inputs.image_sha }}"
          REPO="${{ env.REPO }}"
          SUFFIX="${{ matrix.suffix }}"
          BIN="${{ matrix.binary }}"

          mkdir -p ctx/staging

          # Extract service binary
          docker create --name extract-svc "${REPO}${SUFFIX}:${SHA}"
          docker cp "extract-svc:/usr/local/bin/${BIN}" ctx/
          docker rm extract-svc

          # Extract migrate + migrations from backend image
          docker create --name extract-mig "${REPO}:${SHA}"
          docker cp extract-mig:/usr/local/bin/migrate ctx/
          docker cp extract-mig:/app/migrations ctx/
          docker rm extract-mig

          cp staging/Dockerfile.app ctx/Dockerfile
          cp staging/entrypoint.sh ctx/staging/

          docker build --build-arg "BINARY_NAME=${BIN}" \
            -t "${REPO}${SUFFIX}-staging:${SHA}" ctx/
          docker push "${REPO}${SUFFIX}-staging:${SHA}"

  # ---------------------------------------------------------------------------
  # Production: promote dev → version tag
  # ---------------------------------------------------------------------------
  promote-images:
    name: "Promote images"
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote dev → version + sha (all images)
        run: |
          REPO="${{ env.REPO }}"
          TAG="${{ inputs.ref_name }}"
          SHA="${{ inputs.image_sha }}"
          for suffix in "" "-gateway" "-tenko" "-carins" "-dtako" "-trouble"; do
            docker pull "${REPO}${suffix}:dev"
            docker tag "${REPO}${suffix}:dev" "${REPO}${suffix}:${TAG}"
            docker tag "${REPO}${suffix}:dev" "${REPO}${suffix}:${SHA}"
            docker push "${REPO}${suffix}:${TAG}"
            docker push "${REPO}${suffix}:${SHA}"
          done

  # ---------------------------------------------------------------------------
  # Production: run migrations
  # ---------------------------------------------------------------------------
  migrate:
    name: "Run DB migrations"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [promote-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run migrations
        run: |
          AR_IMAGE="${{ env.AR_PREFIX }}/${{ env.REPO }}:${{ inputs.image_sha }}"
          JOB_NAME="rust-alc-api-migrate"

          if gcloud run jobs describe $JOB_NAME --region ${{ env.REGION }} --project ${{ env.PROJECT }} &>/dev/null; then
            gcloud run jobs update $JOB_NAME \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --image "$AR_IMAGE"
          else
            gcloud run jobs create $JOB_NAME \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --image "$AR_IMAGE" \
              --set-secrets "DATABASE_URL=alc-app-database-url:latest" \
              --command "migrate" \
              --memory 512Mi --task-timeout 120s --max-retries 0
          fi

          gcloud run jobs execute $JOB_NAME \
            --region ${{ env.REGION }} --project ${{ env.PROJECT }} --wait

  # ---------------------------------------------------------------------------
  # Deploy services (shared by staging and production via render.sh)
  # ---------------------------------------------------------------------------
  deploy-services:
    name: "Deploy ${{ matrix.service }}"
    needs: [staging-db, staging-images, promote-images, migrate]
    if: >-
      always() && (
        (github.event_name == 'pull_request' && needs.staging-images.result == 'success' && needs.staging-db.result == 'success') ||
        (startsWith(github.ref, 'refs/tags/v') && needs.migrate.result == 'success')
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [backend, tenko, carins, dtako, trouble]
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Render and deploy
        env:
          ENV_SCRAPER_URL: ${{ vars.SCRAPER_URL }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DEPLOY_ENV="staging"
          else
            DEPLOY_ENV="production"
          fi
          RENDER_ARGS="${{ matrix.service }} ${DEPLOY_ENV} ${{ inputs.image_sha }}"

          if [ "${DEPLOY_ENV}" = "staging" ]; then
            STAGING_URL="${{ vars.STAGING_API_URL }}"
            DB_IMAGE="${{ env.AR_PREFIX }}/${{ env.REPO }}-staging-db:latest"
            RENDER_ARGS="${RENDER_ARGS} --staging-url ${STAGING_URL} --db-image ${DB_IMAGE}"
          fi

          bash cloudrun/render.sh ${RENDER_ARGS} > /tmp/service.yaml

          echo "=== Generated YAML ==="
          cat /tmp/service.yaml

          gcloud run services replace /tmp/service.yaml \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT }}

      - name: Ensure public access (staging)
        if: github.event_name == 'pull_request'
        run: |
          case "${{ matrix.service }}" in
            backend) SVC_NAME="rust-alc-api-staging" ;;
            *)       SVC_NAME="rust-alc-api-staging-${{ matrix.service }}" ;;
          esac
          gcloud run services add-iam-policy-binding "$SVC_NAME" \
            --region ${{ env.REGION }} \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --project ${{ env.PROJECT }}

      - name: Print URL
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then DEPLOY_ENV="staging"; else DEPLOY_ENV="production"; fi
          case "${{ matrix.service }}" in
            backend)
              if [ "${DEPLOY_ENV}" = "staging" ]; then SVC="rust-alc-api-staging"
              else SVC="rust-alc-api"; fi ;;
            *)
              if [ "${DEPLOY_ENV}" = "staging" ]; then SVC="rust-alc-api-staging-${{ matrix.service }}"
              else SVC="rust-alc-api-${{ matrix.service }}"; fi ;;
          esac
          URL=$(gcloud run services describe "$SVC" \
            --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
            --format 'value(status.url)')
          echo "::notice ::${{ matrix.service }} URL: $URL"

  # ---------------------------------------------------------------------------
  # Deploy gateway (after other services, needs their URLs)
  # ---------------------------------------------------------------------------
  deploy-gateway:
    name: "Deploy gateway"
    needs: [deploy-services]
    if: >-
      always() && needs.deploy-services.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Render gateway YAML with service URLs
        run: |
          # Discover backend/service URLs
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BACKEND_URL=$(gcloud run services describe rust-alc-api-staging \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --format 'value(status.url)')
            TENKO_URL=$(gcloud run services describe rust-alc-api-staging-tenko \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --format 'value(status.url)' 2>/dev/null || echo "")
            CARINS_URL=$(gcloud run services describe rust-alc-api-staging-carins \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --format 'value(status.url)' 2>/dev/null || echo "")
            DTAKO_URL=$(gcloud run services describe rust-alc-api-staging-dtako \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --format 'value(status.url)' 2>/dev/null || echo "")
            TROUBLE_URL=$(gcloud run services describe rust-alc-api-staging-trouble \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --format 'value(status.url)' 2>/dev/null || echo "")
          else
            BACKEND_URL=$(gcloud run services describe rust-alc-api \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --format 'value(status.url)')
            TENKO_URL=$(gcloud run services describe rust-alc-api-tenko \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --format 'value(status.url)' 2>/dev/null || echo "")
            CARINS_URL=$(gcloud run services describe rust-alc-api-carins \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --format 'value(status.url)' 2>/dev/null || echo "")
            DTAKO_URL=$(gcloud run services describe rust-alc-api-dtako \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --format 'value(status.url)' 2>/dev/null || echo "")
            TROUBLE_URL=$(gcloud run services describe rust-alc-api-trouble \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
              --format 'value(status.url)' 2>/dev/null || echo "")
          fi

          # Render gateway YAML
          if [ "${{ github.event_name }}" = "pull_request" ]; then GW_ENV="staging"; else GW_ENV="production"; fi
          bash cloudrun/render.sh gateway ${GW_ENV} ${{ inputs.image_sha }} \
            > /tmp/gateway.yaml

          # Replace gateway URL placeholders
          sed -i \
            -e "s|PLACEHOLDER_BACKEND_URL|${BACKEND_URL}|" \
            -e "s|PLACEHOLDER_TENKO_URL|${TENKO_URL}|" \
            -e "s|PLACEHOLDER_CARINS_URL|${CARINS_URL}|" \
            -e "s|PLACEHOLDER_DTAKO_URL|${DTAKO_URL}|" \
            -e "s|PLACEHOLDER_TROUBLE_URL|${TROUBLE_URL}|" \
            /tmp/gateway.yaml

          echo "=== Gateway YAML ==="
          cat /tmp/gateway.yaml

          gcloud run services replace /tmp/gateway.yaml \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT }}

      - name: Ensure public access
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then SVC="rust-alc-api-staging-gateway"
          else SVC="rust-alc-api-gateway"; fi
          gcloud run services add-iam-policy-binding "$SVC" \
            --region ${{ env.REGION }} \
            --member="allUsers" \
            --role="roles/run.invoker" \
            --project ${{ env.PROJECT }}

      - name: Print gateway URL
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then SVC="rust-alc-api-staging-gateway"
          else SVC="rust-alc-api-gateway"; fi
          URL=$(gcloud run services describe "$SVC" \
            --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
            --format 'value(status.url)')
          echo "::notice ::Gateway URL: $URL"

  # ---------------------------------------------------------------------------
  # Staging: smoke test /api/notify/ingest after staging deploy
  #
  # email-receiver Worker から backend に届く shared secret 経路の検証。
  # GitHub Actions secret NOTIFY_WORKER_SECRET_STAGING の値で
  # rust-alc-api-staging /api/notify/ingest を叩く:
  #   - 401 -> secret drift (GCP / Cloud Run env binding / GitHub org secret のどこかで不一致) -> fail
  #   - 404 -> auth pass、tenant 存在しない (= 期待) -> pass
  #   - 400 -> auth pass、body 検証で reject -> pass
  #   - 200 -> auth pass、何かが起きた (smoke tenant が偶然存在) -> pass
  # ingest は gateway を経由せず backend に直接届く設計 (email-receiver Worker
  # の INGEST_ENDPOINT_STAGING と同じ URL)。
  # ---------------------------------------------------------------------------
  smoke-staging-ingest:
    name: "Smoke /api/notify/ingest on staging"
    needs: [deploy-services]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.deploy-services.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/notify/ingest with NOTIFY_WORKER_SECRET_STAGING
        env:
          SECRET: ${{ secrets.NOTIFY_WORKER_SECRET_STAGING }}
          INGEST_URL: https://rust-alc-api-staging-566bls5vfq-an.a.run.app/api/notify/ingest
        run: |
          set -eu
          if [ -z "${SECRET:-}" ]; then
            echo "::error::NOTIFY_WORKER_SECRET_STAGING is empty — check org secret sync (secrets-inventory sync-from-gcp ... ?targets=gh)"
            exit 1
          fi
          # tenant_short_id に意図的に存在しない 8 文字 hex を渡し、
          # auth 通過後 404 (tenant not found) で返ることを期待する。
          http=$(curl -sS -o /tmp/body -w "%{http_code}" -X POST \
            "$INGEST_URL" \
            -H "x-worker-secret: $SECRET" \
            -H "Content-Type: application/json" \
            --data-binary '{"tenant_short_id":"smk00000"}')
          echo "HTTP $http"
          head -c 500 /tmp/body || true
          echo
          if [ "$http" = "401" ]; then
            echo "::error::auth failed — NOTIFY_WORKER_SECRET_STAGING in this repo does not match the value bound to rust-alc-api-staging (Cloud Run env -> GCP notify-worker-secret-staging). Check secrets-inventory get_drift."
            exit 1
          fi
          # 4xx (other than 401) / 200 はすべて auth 通過 = secret OK
          if [ "$http" -lt 200 ] || [ "$http" -ge 500 ]; then
            echo "::error::unexpected HTTP $http (5xx implies backend not yet ready or other issue)"
            exit 1
          fi
          echo "::notice::ingest auth accepted (HTTP $http) — NOTIFY_WORKER_SECRET_STAGING OK"

  # ---------------------------------------------------------------------------
  # Production: update archive job
  # ---------------------------------------------------------------------------
  update-archive:
    name: "Update Archive Job"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [migrate]
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Update archive Job image
        run: |
          AR_IMAGE="${{ env.AR_PREFIX }}/${{ env.REPO }}:${{ inputs.image_sha }}"
          gcloud run jobs update rust-alc-api-archive \
            --region ${{ env.REGION }} --project ${{ env.PROJECT }} \
            --image "$AR_IMAGE"
          echo "::notice ::Archive Job updated"

  # ---------------------------------------------------------------------------
  # Production: verify the tag release did NOT flip traffic
  #
  # deploy/release 分離の invariant チェック: tag (v*) release は新 revision を
  # deploy するだけで、トラフィックは旧 revision に残す (= 切替は Release Wave
  # flip で別途行う) のが正しい。各 production service について「最新 revision の
  # traffic % が 0 か」を確認し、0 でなければ (= release が勝手にフリップした)
  # FAIL する。
  #
  # 注意: 現状の deploy-services は render.sh (traffic ブロック無し) を
  # `gcloud run services replace` するため 100% latest にフリップする。よって
  # 本 check は現状の release では FAIL する想定 — それがまさに検出したい挙動。
  # release を no-traffic 化する (render.sh に traffic ピン / --no-traffic 相当)
  # のは別 PR で対応する。
  # ---------------------------------------------------------------------------
  verify-no-traffic:
    name: "Verify release did not flip traffic"
    needs: [deploy-services, deploy-gateway]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.deploy-services.result == 'success' &&
      needs.deploy-gateway.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Assert latest revision receives 0% traffic
        run: |
          set -euo pipefail
          SERVICES="rust-alc-api rust-alc-api-gateway rust-alc-api-tenko rust-alc-api-carins rust-alc-api-dtako rust-alc-api-trouble"
          fail=0
          for SVC in $SERVICES; do
            echo "::group::$SVC traffic split"
            JSON=$(gcloud run services describe "$SVC" \
              --region ${{ env.REGION }} --project ${{ env.PROJECT }} --format=json)
            LATEST=$(printf '%s' "$JSON" | jq -r '.status.latestReadyRevisionName // ""')
            # 最新 revision に向いている traffic を集計する。traffic entry は
            # revisionName 指定 or latestRevision:true のどちらでも latest を指し得る。
            PCT=$(printf '%s' "$JSON" | jq --arg r "$LATEST" \
              '[.status.traffic[]? | select(.revisionName == $r or .latestRevision == true) | (.percent // 0)] | add // 0')
            echo "latest ready revision: $LATEST"
            printf '%s' "$JSON" | jq -r '.status.traffic[]? | "  \(.percent // 0)% -> \(.revisionName // "@latest")\(if .tag then " (tag: \(.tag))" else "" end)"'
            if [ "${PCT:-0}" != "0" ]; then
              echo "::error::$SVC: newly released revision ($LATEST) is serving ${PCT}% traffic. A tag release must NOT flip traffic — traffic switching is the Release Wave flip's job. Make the production deploy no-traffic."
              fail=1
            else
              echo "OK: latest revision serves 0% (no auto-flip)"
            fi
            echo "::endgroup::"
          done
          if [ "$fail" != "0" ]; then
            exit 1
          fi
          echo "✅ All services: the released revision receives 0% traffic (deploy/release separation holds)."
