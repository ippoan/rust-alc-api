name: CI

# CI パフォーマンス (job 時間の実測ベースライン・改善履歴・実測済み失敗パターン) は
# docs/ci-speed-tracking.md に記録している。CI 高速化の施策を追加/revert する前に必読、
# 実施後は同 doc に実測を追記すること。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-limit:
    name: PR Limit Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check open PRs by same author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          THIS_PR="${{ github.event.pull_request.number }}"
          COUNT=$(gh pr list --repo "${{ github.repository }}" --state open --author "$AUTHOR" --json number -q "[ .[] | select(.number != $THIS_PR) ] | length")
          if [ "$COUNT" -gt 0 ]; then
            echo "::error::$AUTHOR has $COUNT other open PR(s). Close or merge them before creating a new one."
            gh pr list --repo "${{ github.repository }}" --state open --author "$AUTHOR" --json number,title -q ".[] | select(.number != $THIS_PR) | \"  #\\(.number) \\(.title)\""
            exit 1
          fi

  # cache warm (rust-cache / bazel disk tar) + 直後の世代掃除。job 定義は
  # cache-warm.yml に切り出してある — cache が 7 日 TTL で全消失した時に
  # cache-size-report.yml から同じ定義を workflow_dispatch で空回しするため
  # (Refs #574)。ここは main push 時に呼ぶだけの caller。
  cache-warm-all:
    name: Cache Warm
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    uses: ./.github/workflows/cache-warm.yml
    secrets: inherit
    permissions:
      contents: read
      actions: write

  check:
    name: Format & Lint
    needs: [pr-limit]
    if: "always() && !(github.ref == 'refs/heads/main' && github.event_name == 'push') && (needs.pr-limit.result == 'success' || needs.pr-limit.result == 'skipped')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check --all
      # ドメイン分割ガード (Refs #513): ドメイン専用 code が alc-core に再流入したら
      # loud fail する。数秒で終わる grep ベース検査。
      - run: bash scripts/check_domain_split.sh
      - run: cargo clippy --workspace -- -D warnings
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
      # TS bindings 生成 (cargo test export_bindings --workspace) はここから削除し
      # test-lib に統合した (Refs #482)。ts-rs の export_bindings_* は
      # 各 crate の lib target 内 #[test] なので、lib shard の
      # `cargo llvm-cov nextest --lib --workspace` が同じ .ts を生成する
      # (coverage 計装は出力内容に影響しない、diff 検証済み)。check job で
      # test profile のビルドを重複させない。

  # 依存グラフ監視: cargo-deny (重複バージョン warn、設定 SoT は deny.toml) +
  # cargo-machete (未使用依存 warn)。経緯と削減方針は docs/ci-speed-tracking.md の
  # 「依存グラフ削減」参照 (rust-s3 の旧 hyper スタック二重等)。
  dep-check:
    name: Dep Check
    needs: [pr-limit]
    if: "always() && !(github.ref == 'refs/heads/main' && github.event_name == 'push') && (needs.pr-limit.result == 'success' || needs.pr-limit.result == 'skipped')"
    uses: ippoan/ci-workflows/.github/workflows/rust-dep-check.yml@main

  test-lib:
    name: Tests (lib)
    needs: [pr-limit]
    if: "always() && !(github.ref == 'refs/heads/main' && github.event_name == 'push') && (needs.pr-limit.result == 'success' || needs.pr-limit.result == 'skipped')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: llvm-tools-preview
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: test-shared
          save-if: 'false'
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # mold: リンク短縮 (fingerprint 影響なし)
      - uses: rui314/setup-mold@v1

      # alc-notify::redact (lib テスト) が libpdfium.so を dlopen するため必要
      - name: Install PDFium (for redact tests)
        run: |
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7825/pdfium-linux-x64.tgz" \
            | sudo tar -xz -C /tmp
          sudo cp /tmp/lib/libpdfium.so /usr/lib/libpdfium.so
          sudo ldconfig

      # coverage は bazel 側 (Bazel coverage gate) が SoT (#515 PR4)。この job の
      # 役割は lib テスト実行 = ts-rs export_bindings_* を走らせて .ts を生成する
      # ことに縮小した (計装なしの素の nextest なので旧 llvm-cov 実行より速い)。
      - name: Run lib tests (TS bindings 生成)
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
        run: cargo nextest run --lib --workspace

      # ts-rs の export_bindings_* テスト (lib target 内 #[test]) が上の lib 実行で
      # .ts を生成するので、ここで artifact 化する (check job から移設、Refs #482。
      # 旧 test-matrix からの分離を経て本 job に定着)。
      # scripts/export-ts-bindings.sh がこの artifact 名で download する契約は不変。
      # 将来 nextest filter 等で export テストが走らなくなった場合に無音で空
      # artifact にならないよう if-no-files-found: error で loud fail させる。
      - uses: actions/upload-artifact@v4
        with:
          name: ts-bindings-${{ github.sha }}
          path: crates/*/bindings/**/*.ts
          retention-days: 90
          if-no-files-found: error

  # Bazel build → artifact upload (shared by parallel docker jobs)
  build-image:
    name: "Build ${{ matrix.name }}"
    needs: [pr-limit]
    if: "always() && github.event_name == 'pull_request' && (needs.pr-limit.result == 'success' || needs.pr-limit.result == 'skipped')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # staging-bin が非空の service は、prod image に加えて staging image
        # (staging/Dockerfile.app + entrypoint) もこの job で build/push する。
        # 旧 deploy.yml の staging-images job は prod image から docker create/cp
        # でバイナリを取り出して再パッケージしていたが、この job は bazel-bin に
        # バイナリを既に持っているため直接 build できる (= deploy chain の直列
        # hop を 1 個削減、Refs #482)。staging entrypoint が migrate を実行する
        # ため、staging 対象 service は //:migrate も targets に含める。
        include:
          - name: backend
            targets: "//:rust-alc-api //:migrate //:archive"
            binaries: "rust-alc-api migrate archive"
            bin-paths: "bazel-bin/rust-alc-api bazel-bin/migrate bazel-bin/archive"
            dockerfile: Dockerfile
            tag-suffix: ""
            extra-copy: "migrations"
            staging-bin: "rust-alc-api"
    steps:
      - uses: actions/checkout@v4

      # NOTE: external-cache / repository-cache は #506 で追加 → 実測で逆効果と
      # 確定し revert 済み。理由 (PR #506/#507 の 2 run で実測):
      # (1) external cache の manifest は job 名 + PR merge-ref で scope される
      #     ため、cache-warm-bazel (main) からも他 PR からも restore できず恒常 miss
      # (2) save も並列 7 job が同一キーの reserve を取り合って全滅
      # (3) repository-cache (266MB) が hit しても analysis 60s は不変 —
      #     60s の正体はダウンロードではなく repo rule 実行 + loading/analysis の
      #     CPU 処理で、cache では削れない
      # (4) restore/save 試行のオーバーヘッドで job が 139s → 201s に悪化
      # 実測の詳細と他の施策履歴: docs/ci-speed-tracking.md
      - uses: ippoan/setup-bazel@main
        with:
          disk-cache: "bazel-${{ matrix.name }}"
          r2-endpoint: ${{ vars.BAZEL_R2_ENDPOINT }}
          r2-bucket: ${{ vars.BAZEL_R2_BUCKET }}
          r2-access-key-id: ${{ secrets.BAZEL_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.BAZEL_R2_SECRET_ACCESS_KEY }}

      - name: Build (Bazel)
        run: bazel build -c fastbuild --strip=always ${{ matrix.targets }}

      - name: Prepare Docker context
        run: |
          mkdir -p ctx
          cp ${{ matrix.bin-paths }} ctx/
          chmod u+w ctx/*
          strip ctx/*
          cp ${{ matrix.dockerfile }} ctx/Dockerfile
          if [ -n "${{ matrix.extra-copy }}" ]; then
            cp -r ${{ matrix.extra-copy }} ctx/
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ctx
          push: true
          tags: "ghcr.io/${{ github.repository }}${{ matrix.tag-suffix }}:${{ github.sha }}"
          cache-from: "type=gha,scope=${{ matrix.name }}"
          cache-to: "type=gha,mode=max,scope=${{ matrix.name }}"

      # staging image (postgres sidecar 前提の entrypoint + migrate + migrations 同梱)。
      # 旧 staging-images job (deploy.yml) からの移設 (Refs #482)。バイナリは
      # bazel-bin から直接取る (prod image からの docker create/cp 再抽出を廃止)。
      - name: Prepare staging context
        if: matrix.staging-bin != ''
        run: |
          mkdir -p ctx-staging/staging
          cp "ctx/${{ matrix.staging-bin }}" ctx-staging/
          cp bazel-bin/migrate ctx-staging/
          chmod u+w ctx-staging/migrate
          strip ctx-staging/migrate
          cp -r migrations ctx-staging/
          cp staging/Dockerfile.app ctx-staging/Dockerfile
          cp staging/entrypoint.sh ctx-staging/staging/

      - name: Build and push staging image
        if: matrix.staging-bin != ''
        uses: docker/build-push-action@v6
        with:
          context: ctx-staging
          push: true
          build-args: "BINARY_NAME=${{ matrix.staging-bin }}"
          tags: "ghcr.io/${{ github.repository }}${{ matrix.tag-suffix }}-staging:${{ github.sha }}"
          cache-from: "type=gha,scope=${{ matrix.name }}-staging"
          cache-to: "type=gha,mode=max,scope=${{ matrix.name }}-staging"

  # Bazel test 化 PoC (Refs #515): 全 crate の unit test (`<crate>_test` + root
  # `//:unit_tests`) を crate 単位の shard で `bazel test` する。分水嶺検証
  # (result cache / lcov gate / run 跨ぎ hit / sandbox 環境差) は PR #517-#525 で
  # 全て突破済み。
  # 独立 job (deploy chain の needs 外) = critical path に乗らず、merge gate でも
  # ない。coverage gate (coverage_100.toml) の SoT は引き続き cargo llvm-cov 側で、
  # ここの lcov gate は alc-csv-parser 限定の並走検証 (csv-parser shard のみ)。
  # run 跨ぎの test result cache は cache-warm-bazel-test-poc (main push warm) 経由
  # でのみ hit する — PR run 自身の save は refs/pull/N/merge scope に隔離され、
  # 別 PR から読めない (2026-07-05 実測、詳細は #515 のコメント)。
  # shard 分割の狙い: wall time を最重 shard で bounded にする (alc-core 変更時の
  # 単一 job 4-5 分 → 並列 ~2-3 分)。matrix / flags は warm 側と 1:1 同期必須
  # (check_bazel_test_matrix.sh が csv-parser shard で検証)。
  bazel-test-poc:
    name: "Bazel test (${{ matrix.name }})"
    needs: [pr-limit]
    # v* tag push でも走る: cargo Tests matrix 退役後、本番 deploy (deploy.yml) の
    # test gate は bazel 側が担う (Refs #515 PR4)。tag run は main scope の warm
    # cache を restore できる。
    if: "always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && (needs.pr-limit.result == 'success' || needs.pr-limit.result == 'skipped')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # coverage field は .bazelrc の config 名 (cov-<shard名>)。instrumentation_filter の
          # 実体は .bazelrc に置く — ci.yml に書くと setup-bazel の cache key (MODULE/BUILD/
          # .bazelrc の hash) が filter 変更で変わらず、warm が save skip して全 PR が毎回
          # coverage 再ビルドになる (詳細は .bazelrc のコメント、Refs #515)。
          - { name: monolith, target: "//:unit_tests", coverage: "cov-monolith" }
          - { name: mock-carins, target: "//:mock_carins", coverage: "cov-mock-carins" }
          - { name: mock-devices, target: "//:mock_devices", coverage: "cov-mock-devices" }
          - { name: mock-dtako, target: "//:mock_dtako", coverage: "cov-mock-dtako" }
          - { name: mock-misc, target: "//:mock_misc", coverage: "cov-mock-misc" }
          - { name: mock-tenko, target: "//:mock_tenko", coverage: "cov-mock-tenko" }
          - { name: mock-trouble, target: "//:mock_trouble", coverage: "cov-mock-trouble" }
          - { name: auth, target: "//crates/alc-auth:alc-auth_test" }
          - { name: auth-jwt, target: "//crates/alc-auth-jwt:alc-auth-jwt_test", coverage: "cov-auth-jwt" }
          - { name: camera, target: "//crates/alc-camera:alc-camera_test" }
          - { name: carins, target: "//crates/alc-carins:alc-carins_test", coverage: "cov-carins" }
          - { name: compare, target: "//crates/alc-compare:alc-compare_test", coverage: "cov-compare" }
          - { name: core, target: "//crates/alc-core:alc-core_test", coverage: "cov-core" }
          - { name: csv-parser, target: "//crates/alc-csv-parser:alc-csv-parser_test", coverage: "cov-csv-parser" }
          - { name: devices, target: "//crates/alc-devices:alc-devices_test", coverage: "cov-devices" }
          - { name: dtako, target: "//crates/alc-dtako:alc-dtako_test", coverage: "cov-dtako" }
          - { name: misc, target: "//crates/alc-misc:alc-misc_test", coverage: "cov-misc" }
          - { name: notify, target: "//crates/alc-notify:alc-notify_test", pdfium: true, coverage: "cov-notify" }
          - { name: pdf, target: "//crates/alc-pdf:alc-pdf_test", coverage: "cov-pdf" }
          - { name: storage, target: "//crates/alc-storage:alc-storage_test" }
          - { name: tenko, target: "//crates/alc-tenko:alc-tenko_test", coverage: "cov-tenko" }
          - { name: trouble, target: "//crates/alc-trouble:alc-trouble_test", coverage: "cov-trouble" }
    steps:
      - uses: actions/checkout@v4
      - uses: ippoan/setup-bazel@main
        with:
          disk-cache: "bazel-test-${{ matrix.name }}"
          r2-endpoint: ${{ vars.BAZEL_R2_ENDPOINT }}
          r2-bucket: ${{ vars.BAZEL_R2_BUCKET }}
          r2-access-key-id: ${{ secrets.BAZEL_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.BAZEL_R2_SECRET_ACCESS_KEY }}

      # alc-notify::redact が libpdfium.so を dlopen する (test-lib と同一 step、
      # processwrapper-sandbox はシステムパスに到達できるので /usr/lib で足りる)
      - name: Install PDFium (for redact tests)
        if: matrix.pdfium == true
        run: |
          curl -fsSL "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7825/pdfium-linux-x64.tgz" \
            | sudo tar -xz -C /tmp
          sudo cp /tmp/lib/libpdfium.so /usr/lib/libpdfium.so
          sudo ldconfig

      # coverage 付き shard では skip する (Refs #568): 後段の bazel coverage が
      # 同じテストを計装ビルドで実行し、失敗すれば job を fail させる (test gate と
      # して同等)。coverage は別 configuration で bazel test の結果を再利用しない
      # ため、両方走らせると mock 系 shard (モノリス全体をリンク) で特に高くつく。
      - name: bazel test (result cache は main warm から)
        if: ${{ !matrix.coverage }}
        run: |
          set -o pipefail
          bazel test ${{ matrix.target }} --test_output=errors --test_summary=short 2>&1 | tee /tmp/test_run.txt
          if grep -q "(cached)" /tmp/test_run.txt; then
            echo "::notice::${{ matrix.target }} は (cached) — main warm から restore"
          fi

      - name: matrix 網羅性チェック (rust_test target の追加漏れ検出)
        if: matrix.name == 'csv-parser'
        run: bash scripts/check_bazel_test_matrix.sh

      # PR3b (Refs #515): coverage field を持つ shard は lcov を生成して artifact 化。
      # bazel-coverage-gate job が全 shard 分を merge して coverage_100.toml 全域を
      # warn モードで突合する (mock は route / db は Pg repo / unit は crate と、
      # file ごとに寄与 shard が異なるため merge が必須)。flags は warm 側と一致必須。
      # coverage 付き shard の test gate はこの step が兼ねる (Refs #568)。
      - name: bazel coverage (lcov 出力)
        if: matrix.coverage
        run: |
          set -o pipefail
          bazel coverage ${{ matrix.target }} --config=${{ matrix.coverage }} --test_output=errors --test_summary=short 2>&1 | tee /tmp/test_run.txt
          if grep -q "(cached)" /tmp/test_run.txt; then
            echo "::notice::${{ matrix.target }} は (cached) — main warm から restore"
          fi
          LCOV="$(bazel info output_path)/_coverage/_coverage_report.dat"
          cp "$LCOV" /tmp/lcov.dat

      - name: upload lcov artifact
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.name }}
          path: /tmp/lcov.dat
          retention-days: 3

      # csv-parser は PoC で意味論一致を実証済みのため strict gate を維持 (fail する)
      - name: coverage 100% gate の lcov 再現 (coverage_100.toml 突合)
        if: matrix.name == 'csv-parser'
        run: bash scripts/check_coverage_100_lcov.sh /tmp/lcov.dat crates/alc-csv-parser

  # DB integration テストの bazel shard (Refs #515 PR2)。postgres service +
  # TEST_DATABASE_URL + init_local_db.sql を持つ点以外は bazel-test-poc と同じ。
  # sandbox (processwrapper) はネットワークを遮断しないので localhost:5432 に届く。
  # DB を挟むため test result は入力不変でも DB 状態に依存し得るが、テスト自体が
  # 冪等設計 (tenant 分離 + 専用ロック) なので cache hit を許容する。
  bazel-test-db:
    name: "Bazel test (${{ matrix.name }})"
    needs: [pr-limit]
    # v* tag push でも走る (bazel-test-poc と同じ理由、Refs #515 PR4)
    if: "always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) && (needs.pr-limit.result == 'success' || needs.pr-limit.result == 'skipped')"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: db-trouble, target: "//:trouble_test", coverage: "cov-db-trouble" }
          - { name: db-archive, target: "//:archive_repo_test", coverage: "cov-db-archive" }
          - { name: db-hub-measurements, target: "//:hub_measurements_test" }
          # Refs ohishi-exp/rust-ichibanboshi#205 の 38: 運行列挙の期間条件
          # (読取日 OR 運行日) を実 DB で固定する。SQL は実行時クエリなので
          # コンパイル時検査が効かず、窓が縮む退行は静かにデータが減る形で出る
          - { name: db-dtako-operation-window, target: "//:dtako_operation_window_test" }
          # Refs #599: ログイン経路ごとの新規ユーザーの role (LINE WORKS = viewer)
          # を実 DB で固定する。role は実行時 SQL のリテラル / bind で決まり、
          # users.role の DB 既定値が 'admin' なので退行は静かに管理者を増やす
          - { name: db-auth-user-role, target: "//:auth_user_role_test" }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: "postgresql://postgres:test@localhost:5432/postgres?options=-c search_path=alc_api"
    steps:
      - uses: actions/checkout@v4
      - uses: ippoan/setup-bazel@main
        with:
          disk-cache: "bazel-test-${{ matrix.name }}"
          r2-endpoint: ${{ vars.BAZEL_R2_ENDPOINT }}
          r2-bucket: ${{ vars.BAZEL_R2_BUCKET }}
          r2-access-key-id: ${{ secrets.BAZEL_R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.BAZEL_R2_SECRET_ACCESS_KEY }}
      - name: Init test DB (alc_api schema + roles)
        run: psql "postgresql://postgres:test@localhost:5432/postgres" -f scripts/init_local_db.sql
      # coverage 付き shard では skip する (bazel-test-poc 側と同じ理由、Refs #568)
      - name: bazel test (result cache は main warm から)
        if: ${{ !matrix.coverage }}
        run: |
          set -o pipefail
          bazel test ${{ matrix.target }} --test_env=TEST_DATABASE_URL --test_output=errors --test_summary=short 2>&1 | tee /tmp/test_run.txt
          if grep -q "(cached)" /tmp/test_run.txt; then
            echo "::notice::${{ matrix.target }} は (cached) — main warm から restore"
          fi

      # PR3b (Refs #515): DB shard の lcov (Pg repo 実装の寄与分)。flags は warm と一致必須。
      # coverage 付き shard の test gate はこの step が兼ねる (Refs #568)。
      - name: bazel coverage (lcov 出力)
        if: matrix.coverage
        run: |
          set -o pipefail
          bazel coverage ${{ matrix.target }} --test_env=TEST_DATABASE_URL --config=${{ matrix.coverage }} --test_output=errors --test_summary=short 2>&1 | tee /tmp/test_run.txt
          if grep -q "(cached)" /tmp/test_run.txt; then
            echo "::notice::${{ matrix.target }} は (cached) — main warm から restore"
          fi
          LCOV="$(bazel info output_path)/_coverage/_coverage_report.dat"
          cp "$LCOV" /tmp/lcov.dat

      - name: upload lcov artifact
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ matrix.name }}
          path: /tmp/lcov.dat
          retention-days: 3

  # PR3b (Refs #515): 全 shard の lcov を merge して coverage_100.toml 全域を検証する
  # 集約 gate。寄与 shard が file ごとに異なる (mock=route / db=Pg repo / unit=crate)
  # ため per-shard では判定できない。2026-07-05 に全域 63/63 一致を確認して fail 化済み
  # (cargo llvm-cov gate と同等の効力。cargo 側は PR4 で退役)。
  bazel-coverage-gate:
    name: "Bazel coverage gate"
    needs: [bazel-test-poc, bazel-test-db]
    if: "always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lcov-*
          path: /tmp/lcov
      - name: merge lcov + coverage_100.toml 全域突合
        run: |
          shopt -s globstar nullglob
          files=(/tmp/lcov/**/*.dat)
          echo "merged inputs: ${#files[@]}"
          # shard が全滅して artifact 0 件なら loud fail (無言 green を許さない)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::lcov artifact が 0 件 (shard 失敗?)"; exit 1; }
          cat "${files[@]}" > /tmp/merged.dat
          bash scripts/check_coverage_100_lcov.sh /tmp/merged.dat

  # 全 bazel test shard の集約 (Refs #515 PR4)。branch protection の required check は
  # shard 個別 ("Bazel test (xxx)" ×25) ではなくこの job + "Bazel coverage gate" の
  # 2 つに張る — shard を増減しても repo 設定の変更が不要になる。
  bazel-tests-ok:
    name: "Bazel tests OK"
    needs: [bazel-test-poc, bazel-test-db]
    if: "always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))"
    runs-on: ubuntu-latest
    steps:
      - name: 全 shard の成否を検証
        run: |
          [ "${{ needs.bazel-test-poc.result }}" = "success" ] || { echo "::error::bazel-test-poc: ${{ needs.bazel-test-poc.result }}"; exit 1; }
          [ "${{ needs.bazel-test-db.result }}" = "success" ] || { echo "::error::bazel-test-db: ${{ needs.bazel-test-db.result }}"; exit 1; }
          echo "all bazel test shards green"

  # staging の postgres sidecar image。旧 deploy.yml の staging-db job からの
  # 移設 (Refs #482)。build-image と並列に走らせることで、deploy workflow 側の
  # 直列 hop (staging-db → deploy-services) を消す。staging/ 配下は変更頻度が
  # 低く docker layer cache で数十秒で終わるため、deploy の critical path
  # (build-image + bazel gate 待ち) には乗らない。
  staging-db:
    name: Build staging-db
    needs: [pr-limit]
    if: "always() && github.event_name == 'pull_request' && (needs.pr-limit.result == 'success' || needs.pr-limit.result == 'skipped')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push staging-db
        run: |
          docker build -f staging/Dockerfile.postgres \
            -t ghcr.io/${{ github.repository }}-staging-db:latest .
          docker push ghcr.io/${{ github.repository }}-staging-db:latest

  docker-dev:
    name: Tag dev
    if: github.event_name == 'pull_request'
    needs: [build-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy sha tag to dev (all images)
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          SHA="${{ github.sha }}"
          # gateway + per-domain 廃止で monolith 1 image のみ (Refs #556)。
          for suffix in ""; do
            docker pull "${REPO}${suffix}:${SHA}"
            docker tag "${REPO}${suffix}:${SHA}" "${REPO}${suffix}:dev"
            docker push "${REPO}${suffix}:dev"
          done

  docker-latest:
    name: Tag latest
    # NOTE: main push では check も bazel gate も走らない (coverage-check 時代から
    # 恒常 skip = 挙動不変)。coverage-check 退役に伴う参照差し替えのみ。
    if: "always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.check.result == 'success' && needs.bazel-coverage-gate.result == 'success'"
    needs: [check, bazel-coverage-gate]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag dev → sha + latest (all images)
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          SHA="${{ github.sha }}"
          # gateway + per-domain 廃止で monolith 1 image のみ (Refs #556)。
          for suffix in ""; do
            docker pull "${REPO}${suffix}:dev"
            docker tag "${REPO}${suffix}:dev" "${REPO}${suffix}:${SHA}"
            docker tag "${REPO}${suffix}:dev" "${REPO}${suffix}:latest"
            docker push "${REPO}${suffix}:${SHA}"
            docker push "${REPO}${suffix}:latest"
          done

  deploy:
    name: Deploy
    needs: [build-image, staging-db, bazel-tests-ok, bazel-coverage-gate]
    if: >-
      always() &&
      (github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push')) &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped') &&
      (needs.staging-db.result == 'success' || needs.staging-db.result == 'skipped') &&
      needs.bazel-tests-ok.result == 'success' &&
      needs.bazel-coverage-gate.result == 'success'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      packages: write
    with:
      image_sha: ${{ github.sha }}
      ref_name: ${{ github.ref_name }}
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      NOTIFY_WORKER_SECRET_STAGING: ${{ secrets.NOTIFY_WORKER_SECRET_STAGING }}

  # staging への deploy(cutover)が成功した時に、staging の現 backend image を
  # ci-dashboard の compatibility matrix に記録する。これは "build を記録" では
  # なく "staging 環境への deploy event を記録" で、Pact の
  # record-deployment --environment staging と同義 (= 前バージョンを supersede し
  # 「staging の現 image」が一意に保たれる)。frontend は integration test を
  # この staging image 相手に走らせるので突合基準として整合する。
  # current_image は deploy した image tag (= github.sha)。production (v* tag) では
  # 打たない (本番トラフィックを伴う release の記録は別経路 = Release Wave flip)。
  report-backend-compat:
    name: Report backend image (staging)
    needs: [deploy]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: ippoan/ci-workflows/.github/actions/report-backend-deploy@main
        with:
          repo: ${{ github.repository }}
          current_image: ${{ github.sha }}
          deployed_by: rust-alc-api-staging
          webhook_secret: ${{ secrets.RELEASE_WAVE_WEBHOOK_SECRET }}

  # production (v* tag) deploy 成功時、no-traffic で上がった pending revision を
  # ci-dashboard の「Pending releases」に登録する。これで cloudrun も Pending
  # releases に出て、単一 Flip / Flip all (wave) で release-wave-flip が dispatch
  # され、handler の flip-cloudrun が pending-<tag> revision を 100% traffic に
  # flip する。workers と違い cloudrun は frontend-ci を通らないので、ここで報告
  # する必要がある。Refs ippoan/ci-dashboard#237。
  report-pending-release:
    name: Report pending release (production)
    needs: [deploy]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # backend (monolith) の no-traffic (0%) revision に付いた preview tag (deploy.yml)
      # の URL を解決して pending-release の preview_url に載せるため GCP に auth する。
      # gateway + per-domain は #556 で廃止。frontends は production で
      # alc-api.ippoan.org (= backend monolith に domain-mapping) を叩くので、admin が
      # flip 前 E2E に使う preview URL は backend の tagged URL を採る (Refs ci-dashboard#260)。
      # auth-worker の ALC_API_PREVIEW_HOST_SUFFIX も backend を指すよう設定済み。
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: POST pending-release to ci-dashboard
        env:
          CI_DASHBOARD_BASE: https://ci-dashboard.ippoan.org
          RELEASE_WAVE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WAVE_WEBHOOK_SECRET }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          # flip 前 (no-traffic 0%) で上がった production image の識別子。
          # ci-dashboard が consumer に **flip 前** retest を fan-out する anchor
          # (Refs ippoan/ci-dashboard#427)。staging report (current_image) と同じく
          # github.sha = `ghcr.io/ippoan/rust-alc-api:<sha>` を consumer が pull する。
          STAGED_IMAGE: ${{ github.sha }}
          GCP_PROJECT: cloudsql-sv
          GCP_REGION: asia-northeast1
        run: |
          set -uo pipefail
          if [ -z "${RELEASE_WAVE_WEBHOOK_SECRET:-}" ]; then
            echo "::warning::RELEASE_WAVE_WEBHOOK_SECRET 未設定のため pending-release report を skip"
            exit 0
          fi
          # version_id は ci-dashboard の Pending releases 表示/識別用。cloudrun の
          # flip は release-wave-gcp proxy が service の latestReadyRevision を anchor
          # にするため version_id を読まない (Refs ippoan/ci-dashboard#248)。よって
          # ダミーの pending-<tag> ではなく release tag をそのまま入れる。
          version_id="$TAG"
          # preview_url: backend (monolith) の no-traffic revision に付いた preview tag の
          # URL を GCP から解決する (deploy.yml が付ける tag = release タグの sanitize 版)。
          # gateway 廃止 (#556) で backend が alc-api.ippoan.org を提供するため backend を採る。
          # admin が CF Access (preview-*.ippoan.org) 経由で flip 前 E2E に使う。
          # best-effort: 解決できなくても pending-release 自体は preview_url 無しで送る。
          preview_tag="$(printf '%s' "${TAG##*/}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed -e 's/-\{2,\}/-/g' -e 's/^-//' -e 's/-$//' | cut -c1-60)"
          preview_url=$(gcloud run services describe rust-alc-api \
            --region "$GCP_REGION" --project "$GCP_PROJECT" --format=json 2>/dev/null \
            | jq -r --arg t "$preview_tag" '.status.traffic[]? | select(.tag==$t) | .url' \
            | head -1 || true)
          if [ -n "${preview_url:-}" ]; then
            echo "resolved preview_url=$preview_url (tag=$preview_tag)"
          else
            echo "::notice::backend preview URL (tag=$preview_tag) を解決できず。preview_url 無しで報告。"
          fi
          payload=$(jq -nc \
            --arg repo "$REPO" --arg version_id "$version_id" --arg tag "$TAG" \
            --arg preview_url "${preview_url:-}" \
            --arg staged_image "${STAGED_IMAGE:-}" \
            '{repo: $repo, version_id: $version_id, tag: $tag, preview_url: $preview_url, staged_image: $staged_image}
             | with_entries(select(.value != ""))')
          echo "reporting pending release: repo=$REPO tag=$TAG version_id=$version_id"
          # fail-loud: 報告に失敗すると Pending releases に出ず flip できないのに、
          # best-effort(warning) だと緑のまま気付けなかった (Refs ippoan/ci-dashboard#237)。
          # 4xx/5xx で job を fail させる (-f) ことで release CI で即検知する。
          # http_code も出して原因切り分けしやすくする。
          code=$(curl -sS -o /tmp/pending_resp.txt -w '%{http_code}' \
            -X POST "$CI_DASHBOARD_BASE/webhooks/release-wave/pending-release" \
            -H "X-Release-Wave-Webhook-Secret: $RELEASE_WAVE_WEBHOOK_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload") || { echo "::error::pending-release POST に到達できません (network)"; exit 1; }
          echo "pending-release response: HTTP $code"
          cat /tmp/pending_resp.txt || true
          echo ""
          if [ "$code" != "200" ]; then
            echo "::error::pending-release report が HTTP $code で失敗。Pending releases に登録されず flip できません。"
            exit 1
          fi
          echo "✅ pending-release reported"

      # deploy 直後 (flip 前) の実 traffic split を ci-dashboard に報告する。
      # production の no-traffic deploy 直後は「旧 revision 100% + 新 pending 0%」
      # 状態なので、それを GCP 実態として Backend traffic 表に出す
      # (Refs ippoan/ci-dashboard#256)。services は release-wave-targets.yaml と揃える。
      # best-effort: pending-release は上で報告済みなので、ここの失敗は action 内で
      # warning 止まり (job は fail させない)。
      - name: Report backend traffic split (pre-flip pending)
        uses: ippoan/ci-workflows/.github/actions/report-backend-traffic-split@main
        with:
          repo: ${{ github.repository }}
          gcp_project: cloudsql-sv
          gcp_region: asia-northeast1
          services_json: '["rust-alc-api"]'
          release_wave_gcp_base_url: https://release-wave-gcp-staging-566bls5vfq-an.a.run.app
          gcp_api_key: ${{ secrets.RELEASE_WAVE_GCP_API_KEY }}
          ci_dashboard_base_url: https://ci-dashboard.ippoan.org
          webhook_secret: ${{ secrets.RELEASE_WAVE_WEBHOOK_SECRET }}

  # staging deploy 直後に、Cloud Run env (= secretKeyRef で revision 作成時に
  # 解決済み) と GCP Secret Manager の現 latest version の値が一致するかを
  # staging service 自身に問い合わせる (= cross-store drift の自動検出)。
  #
  # service 自身が GCP SM を読む設計のため CI runner は GCP 認証不要 — 単 curl で
  # `{match: bool}` を assert するだけ。WIF / gcloud / secretAccessor grant は不要。
  # Refs ippoan/rust-alc-api#424 / ippoan/email-receiver#1。
  # PR run のみ (tag push の production deploy は対象外)。
  drift-check-staging:
    name: Drift Check (staging)
    needs: [deploy]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Probe /health/secret-fingerprint
        env:
          CONSUMER_URL: 'https://rust-alc-api-staging-566bls5vfq-an.a.run.app/api/health/secret-fingerprint'
          SECRET_NAME: 'INTERNAL_SHARED_SECRET'
        run: |
          set -euo pipefail
          RES=$(curl -sS -w '\n%{http_code}' --max-time 15 \
            "${CONSUMER_URL}?name=${SECRET_NAME}" || true)
          STATUS=$(printf '%s' "$RES" | tail -n1)
          BODY=$(printf '%s' "$RES" | sed '$d')
          {
            echo "# drift-check"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Secret | \`$SECRET_NAME\` |"
            echo "| URL | \`$CONSUMER_URL\` |"
            echo "| HTTP | \`$STATUS\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "200" ]; then
            echo "::error::consumer endpoint returned HTTP $STATUS (expected 200)"
            echo "Body: $BODY"
            exit 1
          fi
          MATCH=$(printf '%s' "$BODY" | jq -r '.match // false')
          if [ "$MATCH" != "true" ]; then
            echo "::error::DRIFT: $SECRET_NAME on Cloud Run env ≠ GCP Secret Manager latest"
            exit 1
          fi
          echo "::notice ::✓ $SECRET_NAME match on $CONSUMER_URL"

  auto-merge:
    name: Auto Merge
    # deploy (staging cutover) + drift-check-staging を needs に含める: merge →
    # branch 削除で走行中の cutover が cancel され deploy 失敗が無音化するのを
    # 防ぐ (Refs #405、#391 で 2 回実害)。drift-check 失敗時も merge を止めて
    # cross-store drift を可視化する (Refs #424)。トレードオフとして staging
    # 障害時は全 PR が merge 不能になる。
    # docker-dev (Tag dev) も needs に含める: merge → branch 削除で :dev への
    # copy が cancel されると、main push の Tag latest / release の Promote images
    # が前 PR の :dev image を無音で promote する (同 #405 と同クラスの穴)。
    needs: [check, bazel-tests-ok, bazel-coverage-gate, build-image, docker-dev, deploy, drift-check-staging]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      needs.check.result == 'success' &&
      needs.bazel-tests-ok.result == 'success' &&
      needs.bazel-coverage-gate.result == 'success' &&
      needs.build-image.result == 'success' &&
      needs.docker-dev.result == 'success' &&
      needs.deploy.result == 'success' &&
      needs.drift-check-staging.result == 'success'
    uses: ippoan/ci-workflows/.github/workflows/auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
      # ci-workflows#170 で auto-merge.yml の job が checks: read を宣言した
      # (全 check green 検証ガード)。caller 側が許可しないと startup_failure
      # (0 job / 0s) になる (Refs ippoan/ci-workflows#169)。
      checks: read
    secrets:
      # GitHub App installation token を優先 (ci-workflows#65)。App は独自の
      # rate-limit bucket を持つので、user PAT の GraphQL quota を食わず
      # "API rate limit already exceeded for user ID" の intermittent fail を
      # 回避できる。org に CI_APP_ID/KEY が無ければ自動で AUTO_MERGE_PAT に fallback。
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
      AUTO_MERGE_PAT: ${{ secrets.TAG_RELEASE_PAT }}
