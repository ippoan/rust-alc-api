name: dep-graph

# `crates/...` (21 crate) の Bazel 依存グラフを `.dot` / `.svg` で出力し、
# GitHub Actions artifact として公開する。ci-dashboard の
# `/dep-graph/rust-alc-api` page から最新 artifact を取得して表示する。
#
# Refs ippoan/ci-dashboard#? (ci-dashboard 側 PR で番号確定後に更新)

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'BUILD.bazel'
      - 'MODULE.bazel'
      - '.github/workflows/dep-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dep-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ippoan/setup-bazel@main
        with:
          disk-cache: bazel-depgraph
          external-cache: true
          repository-cache: true

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Query workspace dependency graph
        # 可視化方針 (Refs ippoan/ci-dashboard#443):
        #
        # - `deps(...) intersect //crates/...` で workspace 内 target に絞る
        #   (rules_rust の external crate 数百個を除外、PR #465 で確定)
        # - `kind('rust_(library|binary)', ...)` で `_test` ターゲットを除外
        #   (test ノードが lib と並ぶと 42 ノードになって横長になるため)
        # - `--noimplicit_deps` で toolchain 暗黙依存も除外
        #
        # 生成された DOT は `//crates/alc-misc:alc-misc` 形式の冗長な label
        # が並ぶので sed で `:` 以前を削って `alc-misc` だけにする。
        # dot コマンドには layout 系オプション (`concentrate=true` で
        # エッジ束ね、`rankdir=TB` で縦長配置、node を box+塗り) を渡す。
        run: |
          set -euo pipefail
          mkdir -p out
          bazel query \
            --noimplicit_deps \
            --output=graph \
            "kind('rust_(library|binary)', deps(//crates/...) intersect //crates/...)" \
            > out/deps.raw.dot

          # node label の短縮: "//crates/alc-misc:alc-misc" -> "alc-misc"
          # (頭の // と最後の : までを削除。test ノードは既に query で除外済み。)
          sed -E 's|//crates/[^:"]*:||g' out/deps.raw.dot > out/deps.dot

          dot -Tsvg out/deps.dot -o out/deps.svg \
            -Grankdir=TB \
            -Gconcentrate=true \
            -Granksep=0.5 \
            -Gnodesep=0.3 \
            -Nshape=box \
            -Nstyle="rounded,filled" \
            -Nfillcolor="#e8f0fe" \
            -Nfontname="Helvetica" \
            -Nfontsize=11 \
            -Eweight=2

      - name: Extract Bazel graph metrics (BEP)
        # 依存グラフ肥大の監視 (docs/ci-performance.md「依存グラフ削減」参照)。
        # analysis 対象の targets / packages 数と analysis 時間を BEP の
        # BuildMetrics から抽出し、Job Summary + しきい値超過で ::warning:: を出す。
        # しきい値は 2026-07-05 実測 (23369 targets / 603 packages) の約 1 割増。
        run: |
          set -euo pipefail
          bazel build --nobuild \
            --build_event_json_file=out/bep.json \
            //:rust-alc-api //:migrate //:archive
          jq -s '(map(select(.buildMetrics != null)) | last // {}) as $e |
            ($e.buildMetrics // {}) as $m |
            { targetsConfigured: (($m.targetMetrics.targetsConfigured // 0) | tonumber),
              packagesLoaded: (($m.packageMetrics.packagesLoaded // 0) | tonumber),
              analysisPhaseMs: (($m.timingMetrics.analysisPhaseTimeInMs // 0) | tonumber) }' \
            out/bep.json > out/graph-metrics.json
          rm -f out/bep.json
          cat out/graph-metrics.json
          TARGETS=$(jq -r '.targetsConfigured' out/graph-metrics.json)
          PACKAGES=$(jq -r '.packagesLoaded' out/graph-metrics.json)
          ANALYSIS_MS=$(jq -r '.analysisPhaseMs' out/graph-metrics.json)
          {
            echo "## Bazel graph metrics"
            echo ""
            echo "| metric | value | warn threshold |"
            echo "|---|---|---|"
            echo "| targets configured | $TARGETS | 26000 |"
            echo "| packages loaded | $PACKAGES | 660 |"
            echo "| analysis phase | ${ANALYSIS_MS} ms | - |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TARGETS" -gt 26000 ]; then
            echo "::warning::Bazel targets configured が $TARGETS (> 26000)。依存グラフ肥大 — docs/ci-performance.md「依存グラフ削減」参照"
          fi
          if [ "$PACKAGES" -gt 660 ]; then
            echo "::warning::Bazel packages loaded が $PACKAGES (> 660)。依存グラフ肥大 — docs/ci-performance.md「依存グラフ削減」参照"
          fi

      - name: Write metadata
        env:
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg repo "$REPO" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg ref "$REF" \
            --arg generated_at "$GENERATED_AT" \
            --arg workflow_run_id "$RUN_ID" \
            '{repo: $repo, commit_sha: $commit_sha, ref: $ref, generated_at: $generated_at, workflow_run_id: $workflow_run_id}' \
            > out/meta.json

      - uses: actions/upload-artifact@v4
        with:
          name: dep-graph
          path: out/
          retention-days: 90
          if-no-files-found: error
