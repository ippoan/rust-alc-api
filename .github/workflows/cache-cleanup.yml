name: Cache Cleanup

# PR close/merge 時にその PR scope の cache を全削除する。
#
# 旧構成にあった週次「最新 10 個以外を全削除」job (cleanup-stale-cache) は削除済み:
# - `--sort last_used` が無効値で gh が即エラー → 作成以来ずっと無音の no-op だった
# - 仮に「直す」と bazel shard tar 21 個を毎週日曜に全滅させる (cargo 時代に cache が
#   数個しか無かった頃の遺物)
# - 世代掃除は ci.yml の cache-cleanup job (base ごと keep 3 / shard tar keep 1) と
#   GitHub の 7 日未アクセス自動削除が既に担っている

on:
  pull_request:
    types: [closed]
  # closed PR の残骸一括掃除 (下の cleanup-closed-prs)。close 時削除は closed
  # イベントの瞬間に 1 回だけ走るため、削除が不完全なまま close された PR
  # (--limit 30 バグ時代の #540-#545 等) には遡って効かない。手動で回収する。
  workflow_dispatch:

jobs:
  cleanup-branch-cache:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Delete caches for closed branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # head.ref は fork の branch 名 = untrusted input。run 内に ${{ }} で
          # 直接展開すると shell injection になるため env 経由で渡す
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # --limit 既定は 30。bazel 化後は 1 PR あたり数十〜数百 entry
          # (shard tar + buildkit blob) あるため、明示しないと大半が残る
          # (実害: merge 済み PR の cache が数 GB 残留し 30GB 上限を圧迫)。
          BRANCH="refs/pull/${PR_NUMBER}/merge"
          echo "Deleting caches for: $BRANCH"
          gh cache list --ref "$BRANCH" --limit 1000 --json id -q '.[].id' | while read id; do
            gh cache delete "$id" || true
          done
          HEAD_REF="refs/heads/${PR_HEAD_REF}"
          echo "Deleting caches for: $HEAD_REF"
          gh cache list --ref "$HEAD_REF" --limit 1000 --json id -q '.[].id' | while read id; do
            gh cache delete "$id" || true
          done

  # 全 cache を列挙し、refs/pull/N/merge のうち PR が closed のものを一括削除する。
  # open PR の cache は残す (走行中 CI の cache hit を壊さない)。
  cleanup-closed-prs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Delete caches of closed PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh cache list -R "$REPO" --limit 5000 \
            --json id,ref,sizeInBytes > /tmp/caches.json
          # open PR の番号一覧 (これ以外の pull ref は closed とみなす)
          gh pr list -R "$REPO" --state open --limit 500 --json number \
            -q '.[].number' > /tmp/open_prs.txt
          python3 - <<'PY'
          import json, re

          caches = json.load(open("/tmp/caches.json"))
          open_prs = {line.strip() for line in open("/tmp/open_prs.txt") if line.strip()}

          to_delete = []
          total = 0
          for e in caches:
              m = re.fullmatch(r"refs/pull/(\d+)/merge", e["ref"])
              if m and m.group(1) not in open_prs:
                  to_delete.append(e)
                  total += e["sizeInBytes"]

          with open("/tmp/ids.txt", "w") as f:
              for e in to_delete:
                  f.write(f"{e['id']}\n")
          print(f"closed-PR 残骸: {len(to_delete)} entries / {total / 1024**3:.2f}GB を削除します")
          PY
          while read -r id; do
            gh cache delete "$id" || true
          done < /tmp/ids.txt
          echo "done"
