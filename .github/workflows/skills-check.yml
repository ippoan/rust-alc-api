name: skills-check

# rust-alc-api-map skill が構造変化に追従しているかを PR diff で検査する
# (ci-workflows#118 / claude-skills#59 Wave 2)。enforce=warn (default)。
# 同時に新規依存 vs knowledge/standards/libs の dependency-check も走る。

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  skills-check:
    uses: ippoan/ci-workflows/.github/workflows/skills-check.yml@main
    with:
      # pilot (ci-workflows#118 PR3): map 更新漏れ / deprecated 依存追加で job fail
      enforce: fail
